<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بث مباشر سريع</title>
    <!-- مكتبة dash.js -->
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* أبعاد فيديو متناسقة أو استخدم cover لملء كامل الشاشة تماماً */
            background-color: #000;
        }
    </style>
</head>
<body>

    <video id="videoPlayer" controls playsinline></video>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var streamUrl = "https://video.fsdv1-2.fna.fbcdn.net/hvideo-cco-atn/_nc_cat-1/_nc_sr_t-4/v/rASfdXiN3Wn3w7458hESITNwhDU2CjyT7YjHAPs3mEm7CUQ/_nc_ohc-ZQ9bP6l91DoQ7kNvwH2C9Qc/live-dash/dash-abr-ibr-audio/1082049241245186.mpd?_nc_zt=28&ccb=2-4&ms=m_CTPA&sc_t=1&oh=00_AQJRsNMDLr7CyGoR1DX8zWGpJX_K_-RwviuObFuJ87jSFw&oe=6AB9C0C0";
            var videoElement = document.querySelector("#videoPlayer");

            var player = dashjs.MediaPlayer().create();

            // إعدادات السرعة وتقليل التأخير
            player.updateSettings({
                'streaming': {
                    'delay': {
                        'liveDelay': 1.5
                    },
                    'buffer': {
                        'fastSwitchEnabled': true,
                        'bufferTimeAtTopQuality': 5,
                        'stableBufferTime': 3
                    },
                    'abr': {
                        'autoSwitchBitrate': { 'video': true }
                    }
                }
            });

            player.initialize(videoElement, streamUrl, true);

            // إجبار تشغيل الصوت والفيديو فوراً
            videoElement.muted = false;
            var playPromise = videoElement.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log("تنبيه: يتطلب الـ WebView السماح بالـ Autoplay مع الصوت من كود التطبيق الأساسي.");
                });
            }
        });
    </script>

</body>
</html>
