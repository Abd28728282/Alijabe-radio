<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إذاعة الشيخ علي جابر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-card {
            position: relative;
            width: 320px;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            color: #fff;
        }

        /* صورة القارئ تدور تلقائياً باستمرار */
        .img-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #f39c12, #d35400);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: rotateImg 20s linear infinite;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes rotateImg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .info p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
        }

        /* موجات الصوت تعمل تلقائياً وبشكل مستمر */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            height: 35px;
        }

        .bar {
            width: 5px;
            height: 8px;
            background: #f39c12;
            border-radius: 3px;
            animation: bounce 1.2s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.4s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.5s; }
        .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 6px; }
            100% { height: 32px; background: #e74c3c; }
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="img-container">
            <img src="https://i.ibb.co/ZzFFQdKD/image.jpg" alt="الشيخ علي جابر">
        </div>

        <div class="info">
            <h2>الشيخ علي جابر</h2>
            <p>إذاعة القرآن الكريم - بث مباشر</p>
        </div>

        <!-- موجات الصوت التفاعلية -->
        <div class="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <!-- عنصر الصوت مع خاصية التشغيل التلقائي -->
    <audio id="audioPlayer" src="https://qurango.net/radio/ali_jaber?1789737689138" autoplay playsinline></audio>

    <script>
        const audio = document.getElementById('audioPlayer');

        // محاولة التشغيل التلقائي فور تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            audio.play().catch(error => {
                console.log("Autoplay was prevented by browser policies:", error);
            });
        });
    </script>
</body>
</html>
